<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Marquee Demo</title>
  <style>
    body{
      margin:0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      background:#0b1020;
      color:#fff;
      display:grid;
      place-items:center;
      min-height:100vh;
    }

    .marquee {
      width: min(900px, 92vw);
      border: 1px solid rgba(255,255,255,.15);
      border-radius: 16px;
      background: rgba(255,255,255,.06);
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0,0,0,.35);
      padding: 12px 0;
    }

    .track {
      display: flex;
      width: max-content;
      animation: scroll 10s linear infinite;
    }

    .text {
      font-size: 42px;
      font-weight: 800;
      letter-spacing: .5px;
      padding: 0 28px;
      white-space: nowrap;
    }

    /* Duplicate the text so the loop is seamless */
    @keyframes scroll {
      from { transform: translateX(0); }
      to   { transform: translateX(-50%); }
    }

    /* Pause on hover */
    .marquee:hover .track { animation-play-state: paused; }

    /* Respect reduced motion settings */
    @media (prefers-reduced-motion: reduce) {
      .track { animation: none; }
    }
  </style>
</head>
<body>

  <div class="marquee" aria-label="Scrolling marquee">
    <div class="track">
      <div class="text">Prateek Sapkota • Prateek Sapkota • Prateek Sapkota • Prateek Sapkota •</div>
      <div class="text">Prateek Sapkota • Prateek Sapkota • Prateek Sapkota • Prateek Sapkota •</div>
    </div>
  </div>

</body>
</html>
